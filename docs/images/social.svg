<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
<title>Webhook Delivery</title><desc>Publish, queue, sign, deliver and retry. A self-hostable Node.js and TypeScript service backed by PostgreSQL.</desc>
<rect width="1280" height="640" fill="#103e35"/><rect x="56" y="56" width="1168" height="528" rx="8" fill="#fff"/><path d="M64 56H72V584H64Q56 584 56 576V64Q56 56 64 56" fill="#198c73"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="136" y="135" fill="#17816e" font-family="Consolas,monospace" font-weight="700" font-size="23" letter-spacing="1">PUBLISH → QUEUE → SIGN → DELIVER → RETRY</text>
<text x="132" y="236" fill="#202020" font-weight="700" font-size="76">webhook-delivery</text>
<text x="136" y="305" fill="#424242" font-size="29">Signed webhooks, durable retries</text><text x="136" y="349" fill="#424242" font-size="29">and a history of every delivery attempt.</text>
