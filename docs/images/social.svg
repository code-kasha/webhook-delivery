<g fill="#172124" font-weight="700" font-size="20"><text x="154" y="509">Node.js · TypeScript</text><text x="383" y="509">PostgreSQL</text><text x="572" y="509">HMAC signatures</text><text x="785" y="509">85 tests</text><text x="954" y="509">Docker · OpenAPI</text></g></g></svg>